services:
  bot:
    build: .
    restart: always
    # 停止时留时间把排队中的 Discord 同步做完（做不完的会在下次启动补发）
    stop_grace_period: 40s
    env_file: .env
    volumes:
      - ./assets:/app/assets
    extra_hosts:
      # 容器内可通过 host.docker.internal 访问宿主机上的代理
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
